url: https://www.samuelbharti.com/plotomics/r

template:
  bootstrap: 5
  bslib:
    primary: "#2761e3"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}

home:
  title: plotomics for R
  description: >
    GPU-accelerated bioinformatics visualization widgets for R, built on
    htmlwidgets and a shared JavaScript core.

# The home page sidebar lists the advisors and the funders next to the author.
# The footer keeps the pkgdown default.
authors:
  sidebar:
    roles: [aut, cre, ths, fnd]

navbar:
  # Naming the structure replaces pkgdown's default rather than adding to it.
  # `intro` links the plotomics.Rmd vignette as Get Started, `articles` covers
  # any future vignette, and `news` must stay listed or NEWS.md builds with
  # nothing linking to it.
  structure:
    left: [intro, reference, articles, news]
    right: [search, site, github]
  components:
    site:
      text: Python & JS
      href: https://www.samuelbharti.com/plotomics/
    github:
      icon: fab fa-github
      href: https://github.com/samuelbharti/plotomics
      aria-label: GitHub repository

reference:
- title: Expression and abundance
  desc: >
    Differential expression, expression matrices and per-feature distributions.
    Each constructor returns an htmlwidget.
  contents:
  - volcano
  - bioheatmap
  - clustermap
  - dotplot
  - violin
- title: Single-cell and spatial
  desc: Dimensionality-reduction maps and measurements placed on tissue.
  contents:
  - embedding
  - spatial
- title: Cohort and variant genomics
  desc: Alteration landscapes, variant positions, survival and signature profiles.
  contents:
  - oncoplot
  - lollipop
  - km
  - bioprofile
- title: Sets, hierarchies and networks
  desc: Set intersections, hierarchical composition and large graphs.
  contents:
  - upset
  - treemap
  - network
- title: Genome and chromatin
  desc: Contact matrices.
  contents:
  - hic
- title: Data helpers
  desc: >
    Precompute the inputs the widgets consume. The widgets draw, they do not
    estimate, so these run the statistics in R where you can see them.
  contents:
  - oncoplot_memo_sort
  - upset_intersections
  - violin_density
- title: Shiny bindings
  desc: Output and render pairs for use in classic Shiny apps.
  contents:
  - ends_with("Output")
  - starts_with("render")
