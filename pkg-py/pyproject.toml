[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotomics"
version = "0.1.0"
description = "High-performance bioinformatics visualization widgets (volcano, heatmaps, dot plot, violin, embedding, spatial, oncoprint, lollipop, Kaplan-Meier, signature profile, UpSet, treemap, network, Hi-C, genome viewers) backed by a shared JavaScript core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Samuel Bharti", email = "samuelbharti.io@gmail.com" }]
keywords = ["bioinformatics", "visualization", "anywidget", "webgl", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Jupyter",
]
dependencies = [
    "anywidget>=0.9.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "anywidget[dev]",
    # Several tests read row and column order from a pandas Categorical. They
    # importorskip, so without pandas here they pass by never running.
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/samuelbharti/plotomics"
Issues = "https://github.com/samuelbharti/plotomics/issues"
DOI = "https://doi.org/10.5281/zenodo.21926306"

# The built JS bundles live under src/plotomics/static/ and are git-tracked, so
# hatchling includes them in both the sdist (VCS files) and the wheel (package
# data) automatically — no force-include/artifacts needed (and adding them would
# double-insert the files and fail the build).
[tool.hatch.build.targets.wheel]
packages = ["src/plotomics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
