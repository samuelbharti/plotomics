[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioviz"
version = "0.0.0"
description = "High-performance bioinformatics visualization widgets (volcano, heatmap, treemap, genome viewers, networks) backed by a shared JavaScript core."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Samuel Bharti", email = "samuel.bharti@posit.co" }]
keywords = ["bioinformatics", "visualization", "anywidget", "webgl", "genomics"]
dependencies = [
    "anywidget>=0.9.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "anywidget[dev]",
]

[project.urls]
Homepage = "https://github.com/samuelbharti/visualization-components"
Issues = "https://github.com/samuelbharti/visualization-components/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bioviz"]

[tool.hatch.build.targets.wheel.force-include]
"src/bioviz/static" = "bioviz/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
