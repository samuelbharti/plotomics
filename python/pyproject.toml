[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioviz"
version = "0.1.0"
description = "High-performance bioinformatics visualization widgets (volcano, heatmap, treemap, genome viewers, networks) backed by a shared JavaScript core."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Samuel Bharti", email = "samuel.bharti@posit.co" }]
keywords = ["bioinformatics", "visualization", "anywidget", "webgl", "genomics"]
dependencies = [
    "anywidget>=0.9.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "anywidget[dev]",
]

[project.urls]
Homepage = "https://github.com/samuelbharti/visualization-components"
Issues = "https://github.com/samuelbharti/visualization-components/issues"

# The built JS bundles live under src/bioviz/static/ and are git-tracked, so
# hatchling includes them in both the sdist (VCS files) and the wheel (package
# data) automatically — no force-include/artifacts needed (and adding them would
# double-insert the files and fail the build).
[tool.hatch.build.targets.wheel]
packages = ["src/bioviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
