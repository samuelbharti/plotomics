version: 2
updates:
  # JavaScript / TypeScript — pnpm workspace manifest at the repo root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # These three are optional peer dependencies. Nothing in pkg-js/src
      # imports them. They are declared for gosling.js and higlass, and those
      # two hold every one of them below its current major:
      #   gosling.js@1.0.7  pixi.js ^6.3.0
      #                     react, react-dom ^16.6.3 || ^17.0.0 || ^18.0.0
      #   higlass@1.13.6    pixi.js ^5.0.3 || ^6.5.2
      #                     react, react-dom ^16.6.3 || ^17.0.0 || ^18.0.0
      #
      # A major bump resolves both libraries against a version they do not
      # support. pnpm allows it, because a peer mismatch is a warning, so the
      # lockfile changes and CI stays green. Nothing catches it, because no
      # test touches the genome browser components.
      #
      # react and react-dom also have to move together. Dependabot proposes
      # them separately, and merging one alone pairs react 19 with react-dom
      # 18, which breaks at runtime on its own.
      #
      # Upgrading gosling.js and higlass is what unblocks all three.
      - dependency-name: "pixi.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      # Collapse routine minor/patch bumps into a single PR to cut noise.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Python package (anywidget wrapper).
  - package-ecosystem: pip
    directory: "/pkg-py"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
