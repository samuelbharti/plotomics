name: Docs

# Builds the documentation websites and deploys them to GitHub Pages:
#   /       landing page (docs/index.html)
#   /r/     R reference, generated by pkgdown from roxygen comments
#   /py/    Python API reference, generated by pdoc from docstrings
#
# One-time setup: in the repository Settings > Pages, set "Source" to
# "GitHub Actions" (not "Deploy from a branch"). The deploy job then publishes
# the site produced here.
#
# Trigger: manual only (workflow_dispatch), to avoid spending Actions minutes on
# every push. Run it from the Actions tab when the docs change. To publish
# automatically instead, add a `push:` trigger:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The R and Python packages embed the JS bundles, so build them first.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist

      # Python API reference (pdoc, from NumPy-style docstrings).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Python docs (pdoc)
        run: |
          python -m pip install --upgrade pip
          pip install ./pkg-py pdoc
          pdoc plotomics --docformat numpy -o site/py

      # R reference (pkgdown, from roxygen comments).
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pkg-r
          extra-packages: any::pkgdown
          needs: website
      - name: Build R docs (pkgdown)
        run: |
          R CMD INSTALL pkg-r
          Rscript -e 'pkgdown::build_site("pkg-r", install = FALSE, new_process = FALSE)'
          cp -r pkg-r/docs site/r

      # Landing page at the site root.
      - name: Assemble landing page
        run: |
          cp docs/index.html site/index.html
          cp docs/.nojekyll site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
