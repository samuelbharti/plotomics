name: Release

# Publishes the tri-language plotomics release on a version tag (e.g. v0.1.0).
#
# Both the Python wheel and the R htmlwidget embed the JavaScript component
# bundles produced by `pnpm dist` (build + sync), so every job runs `pnpm dist`
# first to populate pkg-py/src/plotomics/static and pkg-r/inst/htmlwidgets/lib
# (both git-tracked, rebuilt here) before packaging.
#
# R packaging: the R package (pkg-r) is intentionally NOT published from this
# workflow. It is released via r-universe, which builds the package directly
# from this repository on each push/tag — no CI publish step or token is needed.
# Enable it by adding this repo to an <owner>.r-universe.dev registry
# (packages.json). See https://r-universe.dev. CRAN submission, if ever pursued,
# remains a manual `R CMD check --as-cran` + one-off submission and is
# deliberately not automated here to avoid a heavyweight CRAN workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pypi:
    name: Build & publish Python package (PyPI)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist # populates pkg-py/src/plotomics/static with the JS bundles
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        working-directory: pkg-py
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing / OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg-py/dist

  npm:
    name: Build & publish plotomics (npm)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist # builds pkg-js/*/dist consumed by the published packages
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        # Authentication is npm trusted publishing over OIDC. No token, and no
        # secret in the repository. The publisher on npm names this repository
        # and this workflow file, so neither can be renamed on its own.
        #
        # pnpm 11.0.8 broke the OIDC exchange and returned 404 (pnpm/pnpm#11513).
        # The fix landed in May 2026 and this repository pins pnpm 11.9.0, which
        # carries it. A 404 at this step means that regression came back.
        #
        # One unscoped package, matching `pip install plotomics` and the CRAN
        # name. The shared core ships inside it as the `plotomics/core` subpath,
        # so there is no second package to publish and no ordering to get wrong.
        # Only dist/lib is packed; the umd/ and anywidget/ bundles built above
        # are R and Python delivery artifacts and are excluded by `files`.
        run: pnpm publish --filter plotomics --no-git-checks --access public --provenance

  github-release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    needs: [pypi, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version's changelog section
        id: notes
        # Take the lines between this version's heading and the next one, so the
        # release body matches CHANGELOG.md instead of being generated twice.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          name: ${{ github.ref_name }}
