name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (build · test · typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - run: pnpm -r --filter "./packages/**" typecheck
      - run: pnpm -r --filter "./packages/**" test
      - name: Upload built bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            r/bioviz/inst/htmlwidgets/lib/bioviz
            python/src/bioviz/static
          if-no-files-found: error

  r:
    name: R (R CMD check)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/bioviz
          extra-packages: |
            any::rcmdcheck
            any::testthat
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/bioviz
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    needs: js
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
