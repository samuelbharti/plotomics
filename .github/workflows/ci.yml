name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (build · test · typecheck · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm dist
      - name: Verify committed bundles are up to date
        run: |
          # Stage first so a newly-added-but-uncommitted bundle (e.g. a brand
          # new component's JS) fails too — plain `git diff` only sees tracked
          # files, which would let a missing bundle ship silently.
          git add -A pkg-r/inst/htmlwidgets/lib/plotomics pkg-py/src/plotomics/static
          git diff --cached --exit-code pkg-r/inst/htmlwidgets/lib/plotomics pkg-py/src/plotomics/static
      - run: pnpm -r --filter "./pkg-js/**" typecheck
      - run: pnpm -r --filter "./pkg-js/**" test
      - name: Upload built bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: |
            pkg-r/inst/htmlwidgets/lib/plotomics
            pkg-py/src/plotomics/static
          if-no-files-found: error

  r:
    name: R (R CMD check)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pkg-r
          extra-packages: |
            any::rcmdcheck
            any::testthat
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: pkg-r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    needs: js
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        working-directory: pkg-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
