name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (build · test · typecheck · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm dist
      - run: pnpm -r --filter "./pkg-js/**" typecheck
      - run: pnpm -r --filter "./pkg-js/**" test
      # The landing page demo (docs/landing) bundles the components from
      # source, and docs.yml builds it on main only. Type-checking and bundling
      # it here makes a pkg-js change that breaks the demo fail on the pull
      # request, not in the docs deploy.
      - name: Check the landing page demo
        run: |
          npx tsc --noEmit -p docs/landing
          node scripts/build-landing.mjs "$RUNNER_TEMP/landing"
      # gosling.js and igv.js load only in a real browser, so the Node tests
      # above never import them. A dependency bump that breaks either one
      # passes every earlier step. These tests mount both in headless Chromium.
      - name: Install Chromium for the browser tests
        run: pnpm --filter plotomics exec playwright install --with-deps --only-shell chromium
      - run: pnpm -r --filter "./pkg-js/**" test:browser
      # docs.yml runs on main only, and in one job with the R and Python docs.
      # Building the JavaScript reference here makes a TypeDoc failure show up
      # on the pull request, before it can stop the whole docs deploy.
      - name: Build the JavaScript reference
        run: pnpm --filter plotomics docs:build
      # typecheck and test run before the bundle check on purpose. Any
      # dependency bump makes the committed bundles stale, so checking them
      # first turned an expected, mechanical failure into a wall that hid
      # whether the code still compiles and passes its tests.
      - name: Verify committed bundles are up to date
        run: |
          # Stage first so a newly-added-but-uncommitted bundle (e.g. a brand
          # new component's JS) fails too — plain `git diff` only sees tracked
          # files, which would let a missing bundle ship silently.
          git add -A pkg-r/inst/htmlwidgets/lib/plotomics pkg-py/src/plotomics/static
          git diff --cached --exit-code pkg-r/inst/htmlwidgets/lib/plotomics pkg-py/src/plotomics/static
      - name: Upload built bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: |
            pkg-r/inst/htmlwidgets/lib/plotomics
            pkg-py/src/plotomics/static
          if-no-files-found: error

  r:
    name: R (R CMD check)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pkg-r
          extra-packages: |
            any::rcmdcheck
            any::testthat
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: pkg-r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      # test-docs.R checks the README code, the help examples and the URL
      # in DESCRIPTION. R CMD check runs the tests on the built package,
      # which has no README.md, _pkgdown.yml or man/*.Rd, so it skips them
      # there. This runs them on the source tree.
      - name: Test the docs in the source tree
        run: |
          R CMD INSTALL pkg-r
          Rscript -e 'testthat::test_file("pkg-r/tests/testthat/test-docs.R", package = "plotomics", load_package = "installed", stop_on_failure = TRUE)'

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    needs: js
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        working-directory: pkg-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
